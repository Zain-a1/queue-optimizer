<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueueFlow - Staff Command Center</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            color: #0f172a;
            min-height: 100vh;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Staff Login Modal Gate -->
    <div id="login-modal" class="fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-4 backdrop-blur-md">
        <div class="bg-white border-2 border-indigo-100 p-8 rounded-3xl max-w-sm w-full shadow-2xl animate-fade-in">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 text-white rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-indigo-500/30 text-2xl">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2 class="text-2xl font-black text-slate-900">Staff Portal</h2>
                <p class="text-xs text-indigo-600 font-extrabold uppercase tracking-wider mt-1">Authorized Operator Terminal</p>
            </div>
            
            <form onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <!-- HIGH CONTRAST LABEL -->
                    <label class="block text-xs font-black text-slate-800 uppercase tracking-wider mb-2">
                        Security PIN <span class="text-indigo-600">(Default: 1234)</span>
                    </label>
                    <input type="text" id="passcode" autocomplete="off" spellcheck="false" required placeholder="Type PIN here..." class="w-full bg-slate-50 border-2 border-indigo-200 rounded-2xl px-4 py-3.5 text-lg font-black text-slate-900 focus:outline-none focus:border-indigo-600 focus:bg-white transition shadow-inner">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:opacity-95 text-white font-black py-4 rounded-2xl transition text-sm shadow-xl shadow-indigo-600/30">
                    Unlock Dashboard &rarr;
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <a href="index.html" class="text-xs text-slate-600 hover:text-indigo-600 transition font-bold flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Return to Customer Kiosk</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Protected Staff Interface -->
    <div id="staff-dashboard" class="hidden flex-grow flex flex-col">
        <!-- Vibrant Header -->
        <header class="gradient-header text-white shadow-xl sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <div class="bg-white/20 text-white p-3 rounded-2xl backdrop-blur-md shadow-inner">
                        <i class="fa-solid fa-desktop text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-black tracking-tight text-white">QueueFlow Operator</h1>
                        <span class="text-[10px] bg-white/20 text-white border border-white/30 px-3 py-0.5 rounded-full uppercase tracking-wider font-extrabold">Counter Management</span>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <a href="analytics.html" class="bg-white/10 hover:bg-white/20 text-white text-xs px-4 py-2.5 rounded-xl transition font-bold border border-white/20 backdrop-blur-md flex items-center space-x-2 shadow-sm">
                        <i class="fa-solid fa-chart-line text-indigo-200"></i>
                        <span>Analytics</span>
                    </a>
                    <button onclick="handleLogout()" class="text-xs text-white bg-red-500 hover:bg-red-600 font-bold px-4 py-2.5 rounded-xl transition shadow-md">
                        Lock Terminal
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl w-full mx-auto px-6 py-8 flex-grow space-y-8">
            <!-- Counter Controls Section -->
            <div>
                <h3 class="text-xs font-black text-slate-700 uppercase tracking-widest mb-4 flex items-center">
                    <i class="fa-solid fa-cubes text-indigo-600 mr-2"></i> Service Counter Operations
                </h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6" id="staff-counters-grid"></div>
            </div>

            <!-- Queue Line Table -->
            <div class="bg-white border-2 border-slate-200/80 rounded-3xl overflow-hidden shadow-xl">
                <div class="px-6 py-5 border-b border-slate-200 flex justify-between items-center bg-slate-50/80">
                    <h3 class="font-black text-base text-slate-900 flex items-center space-x-2">
                        <i class="fa-solid fa-list-ol text-indigo-600"></i>
                        <span>Active Waiting Queue</span>
                    </h3>
                    <span id="queue-badge" class="text-xs bg-indigo-100 text-indigo-800 border border-indigo-300 px-3.5 py-1.5 rounded-full font-black">0 waiting</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead>
                            <tr class="text-xs text-slate-700 uppercase border-b border-slate-200 bg-slate-100/70 font-black">
                                <th class="py-4 px-6">Token</th>
                                <th class="py-4 px-6">Service Type</th>
                                <th class="py-4 px-6">Queue Status</th>
                                <th class="py-4 px-6 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="staff-queue-tbody" class="divide-y divide-slate-200"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-600 font-bold">
        QueueFlow Operator Hub &bull; Secure Encrypted Session
    </footer>

    <script src="app.js"></script>
    <script>
        function handleLogin(e) {
            e.preventDefault();
            const pin = document.getElementById('passcode').value;
            if (pin === '1234' || pin === 'admin') {
                setCounterAuth(true);
                checkAuth();
            } else {
                alert('Invalid PIN! Try "1234"');
            }
        }

        function handleLogout() {
            setCounterAuth(false);
            checkAuth();
        }

        function checkAuth() {
            const isAuth = getCounterAuth();
            const modal = document.getElementById('login-modal');
            const dash = document.getElementById('staff-dashboard');

            if (isAuth) {
                modal.classList.add('hidden');
                dash.classList.remove('hidden');
                renderStaffView();
            } else {
                modal.classList.remove('hidden');
                dash.classList.add('hidden');
            }
        }

        function renderStaffView() {
            const counters = getCounters();
            const queue = getQueue();

            // Render Counter Cards with High Contrast Colors
            document.getElementById('staff-counters-grid').innerHTML = counters.map(c => `
                <div class="bg-white border-2 border-slate-200/90 p-6 rounded-3xl flex flex-col justify-between shadow-lg card-hover">
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <span class="font-black text-slate-900 text-lg">${c.name}</span>
                            <span class="text-[11px] px-3 py-1 rounded-full font-black uppercase tracking-wider ${c.status === 'open' ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : 'bg-rose-100 text-rose-800 border border-rose-300'}">
                                ${c.status}
                            </span>
                        </div>
                        <div class="bg-indigo-50/70 border border-indigo-100 p-5 rounded-2xl text-center my-4 shadow-inner">
                            <span class="text-[10px] uppercase font-black text-indigo-700 block mb-1">Serving Token</span>
                            <span class="text-3xl font-black text-indigo-900">${c.currentToken || 'None'}</span>
                        </div>
                    </div>
                    <div class="flex space-x-3">
                        <button onclick="toggleCounter(${c.id})" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs py-3 rounded-xl transition font-extrabold border border-slate-300">
                            ${c.status === 'open' ? 'Close Counter' : 'Open Counter'}
                        </button>
                        ${c.status === 'open' ? `<button onclick="callNext(${c.id})" class="flex-1 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white text-xs py-3 rounded-xl transition font-black shadow-lg shadow-indigo-600/30">Call Next</button>` : ''}
                    </div>
                </div>
            `).join('');

            // Update Table Data
            document.getElementById('queue-badge').innerText = `${queue.length} waiting`;
            const tbody = document.getElementById('staff-queue-tbody');
            if (queue.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-10 text-center text-slate-500 font-bold">No customers waiting in queue.</td></tr>`;
                return;
            }

            tbody.innerHTML = queue.map((t, idx) => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="py-4 px-6 font-black text-indigo-600 text-base">${t.id}</td>
                    <td class="py-4 px-6 text-slate-900 font-bold">${t.serviceName}</td>
                    <td class="py-4 px-6"><span class="bg-amber-100 text-amber-900 text-xs px-3 py-1 rounded-xl border border-amber-300 font-black">Waiting (#${idx+1})</span></td>
                    <td class="py-4 px-6 text-right"><button onclick="prioritizeToken('${t.id}')" class="text-xs bg-indigo-50 text-indigo-700 hover:bg-indigo-600 hover:text-white px-4 py-2 rounded-xl transition font-black border border-indigo-200 shadow-sm">Prioritize</button></td>
                </tr>
            `).join('');
        }

        function toggleCounter(id) {
            let counters = getCounters();
            const c = counters.find(item => item.id === id);
            c.status = c.status === 'open' ? 'closed' : 'open';
            setCounters(counters);
            renderStaffView();
        }

        function callNext(counterId) {
            let counters = getCounters();
            let queue = getQueue();
            const c = counters.find(item => item.id === counterId);

            if (queue.length > 0) {
                const served = queue.shift();
                c.currentToken = served.id;
                setCompletedCount(getCompletedCount() + 1);
            } else {
                c.currentToken = null;
            }

            setCounters(counters);
            setQueue(queue);
            renderStaffView();
        }

        function prioritizeToken(id) {
            let queue = getQueue();
            const idx = queue.findIndex(t => t.id === id);
            if (idx > -1) {
                const item = queue.splice(idx, 1)[0];
                queue.unshift(item);
                setQueue(queue);
                renderStaffView();
            }
        }

        window.onload = () => {
            checkAuth();
            setInterval(() => { if(getCounterAuth()) renderStaffView(); }, 1000);
        };
    </script>
</body>
</html>
